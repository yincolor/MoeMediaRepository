<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/Theme.css">
    <script src="../js/components/icon_btn.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/gamepad.js"></script>
    <script src="../js/keyboard_simulate.js"></script>
    <script src="../js/hls/hls.min.js"></script>
    <script src="../js/page/play.js"></script>
</head>
<body>
    <div class="page">
        <!-- 使用 hls.js 播放 m3u8 HLS 流媒体 -->
        <video></video>

        <div class="control-layer">
            <div class="process">
                <input type="range" min="0" max="100" step="0.01">
            </div>
            <div class="playstop">
                <icon-btn icon-name="播放" layout-type="IconOnly" icon-size="8em"></icon-btn>
            </div>
            <div class="volume">
                <icon-btn icon-name="音量" layout-type="IconOnly" icon-size="3em"></icon-btn>
                <span class="volumn-value">100</span><span>%</span>
            </div>
        </div>
    </div>

    <style>
        video{
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
        }
        .control-layer{
            position: fixed;
            top: 10px;
            bottom: 10px;
            left: 10px;
            right: 10px;
        }
        .control-layer .process{
            position: absolute;
            bottom: 2em;
            width: 100%;
            display: flex;
            /* padding: 0px 20px; */
        }
        .control-layer .process input{
            flex: 1 0 auto;
        }
        .control-layer .playstop{
            display: inline-block;
            position: fixed;
            bottom: 4em;
        }
        .control-layer .volume{
            display: inline-block;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            padding: var(--padding);
            background-color: rgba(23, 23,23, 0.5);
            border-radius: var(--border-radius);
            font-size: 2em;
        }
        .control-layer .volume span{
            vertical-align: middle;
        }
    </style>
</body>
</html>
